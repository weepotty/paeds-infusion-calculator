name: Checks and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check drugs.yaml
        run: npm run validate
      - name: Rate table
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:drugs.yaml" > "$RUNNER_TEMP/before.yaml" || rm -f "$RUNNER_TEMP/before.yaml"
          npm run --silent rate-table -- "$RUNNER_TEMP/before.yaml" drugs.yaml >> "$GITHUB_STEP_SUMMARY"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
